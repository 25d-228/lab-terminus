[package]
name = "lab-terminus"
version = "0.1.0"
description = "Lab Terminus — cross-platform lab-server manager"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
russh = { version = "0.61", default-features = false, features = ["ring"] }
russh-sftp = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
portable-pty = "0.8"
futures-util = "0.3"
bytes = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
